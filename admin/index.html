<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel administrativo</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#f4f4f5;color:#18181b}
header{background:#18181b;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{margin-right:auto} nav button{background:none;border:0;color:#ccc;cursor:pointer;padding:6px 10px;font-size:14px}
nav button.on{color:#fff;border-bottom:2px solid #e60023}
main{max-width:1000px;margin:20px auto;padding:0 16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{background:#fafafa;font-size:12px;text-transform:uppercase;color:#666}
input,select,textarea{padding:7px;border:1px solid #ccc;border-radius:6px;font:inherit}
button.a{background:#e60023;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
button.s{background:#e4e4e7;color:#18181b;border:0;border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
.card{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.k{font-size:24px;font-weight:700}.err{color:#b91c1c;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
</style></head><body>
<div id="app"></div>
<script>
const $app = document.getElementById('app');
let token = localStorage.getItem('admin_token'), tab = 'dashboard';
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : k === 'class' ? e.className = v : e[k] = v;
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
async function api(method, path, body) {
  const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 || (r.status === 403 && path !== '/auth/login')) { logout(); throw new Error('Sessão expirada'); }
  if (!r.ok) throw new Error(j.message || 'Erro ' + r.status);
  return j;
}
const A = (m, p, b) => api(m, '/swagger-control' + p, b);
const money = n => Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
const date = d => d ? new Date(d).toLocaleString('pt-BR') : '';
function logout() { token = null; localStorage.removeItem('admin_token'); render(); }
function table(heads, rows) {
  return el('table', {}, el('tr', {}, heads.map(h => el('th', {}, h))), rows.map(r => el('tr', {}, r.map(c => el('td', {}, c)))));
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { alert(e.message); } };

function loginView() {
  const email = el('input', { type: 'email', placeholder: 'E-mail' }), pw = el('input', { type: 'password', placeholder: 'Senha' });
  const err = el('div', { class: 'err' });
  const go = async () => {
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: email.value, password: pw.value }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.message);
      if (j.data.user.role !== 'admin') throw new Error('Esta conta não é de administrador');
      token = j.data.token; localStorage.setItem('admin_token', token); render();
    } catch (e) { err.textContent = e.message; }
  };
  pw.addEventListener('keydown', e => e.key === 'Enter' && go());
  return el('main', {}, el('div', { class: 'card', style: 'max-width:340px;margin:80px auto;display:grid;gap:10px' },
    el('h2', {}, 'Painel administrativo'), email, pw, err, el('button', { class: 'a', onclick: go }, 'Entrar')));
}

const views = {
  async dashboard() {
    const d = (await A('GET', '/dashboard')).data;
    const items = [['Usuários', d.totalUsers], ['Novos (7 dias)', d.newUsers], ['Anúncios ativos', d.activeAds], ['Vendas', d.totalSales],
      ['Receita', money(d.totalRevenue)], ['Saques pendentes', d.pendingWithdrawals], ['Total pago', money(d.totalPaidOut)], ['Tickets abertos', d.openTickets]];
    return el('div', { class: 'grid' }, items.map(([l, v]) => el('div', { class: 'card' }, el('div', {}, l), el('div', { class: 'k' }, v))));
  },
  async users() {
    const search = el('input', { placeholder: 'Buscar nome ou e-mail' });
    const box = el('div');
    const load = async () => {
      const r = (await A('GET', '/users?limit=100&search=' + encodeURIComponent(search.value))).data;
      box.replaceChildren(table(['ID', 'Nome', 'E-mail', 'Perfil', 'Status', 'Saldo anúncios', 'Saldo saque', 'Ações'], r.map(u => [
        u.id, u.name, u.email, u.role, u.status, money(u.balance), money(u.withdrawBalance),
        el('span', {},
          el('button', { class: 's', onclick: guard(async () => { await A('PATCH', `/users/${u.id}/toggle-status`); load(); }) }, u.status === 'active' ? 'Bloquear' : 'Desbloquear'), ' ',
          el('button', { class: 's', onclick: guard(async () => {
            const v = prompt('Valor a creditar (negativo para debitar):'); if (!v) return;
            const w = confirm('OK = saldo de anúncios\nCancelar = saldo de saque') ? 'balance' : 'withdraw';
            const reason = prompt('Motivo do ajuste:') || 'Ajuste administrativo';
            await A('PATCH', `/users/${u.id}/adjust-balance`, { amount: Number(v.replace(',', '.')), wallet: w, reason }); load();
          }) }, 'Ajustar saldo'))])));
    };
    search.addEventListener('change', guard(load)); await load();
    return el('div', {}, el('div', { class: 'row' }, search), box);
  },
  async withdrawals() {
    const sel = el('select', {}, ['pending', 'completed', 'rejected', 'cancelled', ''].map(s => el('option', { value: s }, s || 'todos')));
    const box = el('div');
    const load = async () => {
      const r = (await A('GET', '/withdrawals?limit=100&status=' + sel.value)).data;
      box.replaceChildren(table(['ID', 'Usuário', 'Valor', 'Chave PIX', 'Status', 'Data', 'Ações'], r.map(w => [
        w.id, `${w.user.name} (${w.user.email})`, money(w.amount), `${w.pixKeyType}: ${w.pixKey}`, w.status, date(w.createdAt),
        w.status === 'pending' ? el('span', {},
          el('button', { class: 's', onclick: guard(async () => { if (!confirm('Confirme que o PIX JÁ foi enviado ao usuário.')) return; await A('POST', `/withdrawals/${w.id}/approve`, {}); load(); }) }, 'Marcar como pago'), ' ',
          el('button', { class: 's', onclick: guard(async () => { const reason = prompt('Motivo da recusa:'); if (reason === null) return; await A('POST', `/withdrawals/${w.id}/reject`, { reason }); load(); }) }, 'Recusar')) : (w.note || '')])));
    };
    sel.addEventListener('change', guard(load)); await load();
    return el('div', {}, el('div', { class: 'row' }, sel), box);
  },
  async products() {
    const f = Object.fromEntries(['name', 'category', 'price', 'commissionPercentage', 'image'].map(k => [k, el('input', { placeholder: { name: 'Nome', category: 'Categoria', price: 'Preço', commissionPercentage: 'Comissão %', image: 'URL da imagem' }[k] })]));
    const desc = el('input', { placeholder: 'Descrição', style: 'min-width:240px' });
    const box = el('div');
    const load = async () => {
      const r = (await A('GET', '/products?limit=100')).data;
      box.replaceChildren(table(['ID', 'Nome', 'Categoria', 'Preço', 'Comissão', 'Ativo', ''], r.map(p => [p.id, p.name, p.category, money(p.price), p.affiliation.commission.percentage + '%', p.active ? 'sim' : 'não',
        el('button', { class: 's', onclick: guard(async () => { if (confirm('Remover produto?')) { await A('DELETE', `/products/${p.id}`); load(); } }) }, 'Remover')])));
    };
    const add = guard(async () => {
      await A('POST', '/products', { ...Object.fromEntries(Object.entries(f).map(([k, i]) => [k, i.value])), description: desc.value });
      Object.values(f).forEach(i => i.value = ''); desc.value = ''; load();
    });
    await load();
    return el('div', {}, el('div', { class: 'card row' }, Object.values(f), desc, el('button', { class: 'a', onclick: add }, 'Adicionar produto')), box);
  },
  async pins() {
    const title = el('input', { placeholder: 'Título' }), image = el('input', { placeholder: 'URL da imagem' }), cat = el('input', { placeholder: 'Categoria' });
    const box = el('div');
    const load = async () => {
      const r = (await A('GET', '/pins?limit=100')).data;
      box.replaceChildren(table(['ID', 'Imagem', 'Título', 'Categoria', 'Curtidas', ''], r.map(p => [p.id, el('img', { src: p.image, height: 48 }), p.title, p.category, p.likes,
        el('button', { class: 's', onclick: guard(async () => { await A('DELETE', `/pins/${p.id}`); load(); }) }, 'Remover')])));
    };
    const add = guard(async () => { await A('POST', '/pins', { title: title.value, image: image.value, category: cat.value || 'Variados' }); title.value = image.value = cat.value = ''; load(); });
    await load();
    return el('div', {}, el('div', { class: 'card row' }, title, image, cat, el('button', { class: 'a', onclick: add }, 'Adicionar pin')), box);
  },
  async support() {
    const box = el('div');
    const load = async () => {
      const r = (await A('GET', '/support/tickets?limit=100')).data;
      box.replaceChildren(table(['ID', 'Usuário', 'Assunto', 'Status', 'Atualizado', ''], r.map(t => [t.id, `${t.user.name} (${t.user.email})`, t.subject, t.status, date(t.updatedAt),
        el('button', { class: 's', onclick: guard(() => openTicket(t.id)) }, 'Abrir')])));
    };
    const openTicket = async id => {
      const t = (await A('GET', `/support/tickets/${id}`)).data.ticket;
      const txt = el('textarea', { rows: 3, style: 'width:100%' });
      box.replaceChildren(el('button', { class: 's', onclick: load }, '← Voltar'), el('div', { class: 'card' }, el('h3', {}, t.subject),
        t.messages.map(m => el('p', {}, el('b', {}, m.sender === 'admin' ? 'Suporte' : t.user.name), ' · ', date(m.createdAt), el('br'), m.message)),
        txt, el('div', { class: 'row' },
          el('button', { class: 'a', onclick: guard(async () => { if (!txt.value.trim()) return; await A('POST', `/support/tickets/${id}/reply`, { message: txt.value }); openTicket(id); }) }, 'Responder'),
          el('button', { class: 's', onclick: guard(async () => { await A('PATCH', `/support/tickets/${id}/status`, { status: 'resolved' }); load(); }) }, 'Marcar resolvido'))));
    };
    await load(); return box;
  },
  async broadcast() {
    const title = el('input', { placeholder: 'Título' }), msg = el('textarea', { rows: 3, placeholder: 'Mensagem', style: 'width:100%' });
    return el('div', { class: 'card' }, el('h3', {}, 'Comunicado para todos os usuários'), title, el('br'), msg, el('br'),
      el('button', { class: 'a', onclick: guard(async () => { const r = await A('POST', '/notifications/broadcast', { title: title.value, message: msg.value }); alert(`Enviado para ${r.data.recipients} usuários`); title.value = msg.value = ''; }) }, 'Enviar'));
  },
};
const labels = { dashboard: 'Resumo', users: 'Usuários', withdrawals: 'Saques', products: 'Produtos', pins: 'Pins', support: 'Suporte', broadcast: 'Comunicados' };

async function render() {
  if (!token) return $app.replaceChildren(loginView());
  const content = el('main');
  $app.replaceChildren(el('header', {}, el('b', {}, 'Painel administrativo'),
    el('nav', {}, Object.entries(labels).map(([k, l]) => el('button', { class: k === tab ? 'on' : '', onclick: () => { tab = k; render(); } }, l))),
    el('button', { class: 's', onclick: logout }, 'Sair')), content);
  try { content.replaceChildren(await views[tab]()); } catch (e) { if (token) content.replaceChildren(el('div', { class: 'err' }, e.message)); }
}
render();
</script></body></html>
